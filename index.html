<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yol Haritası</title><style>body{font-family:system-ui;margin:0;background:#f5f7f4;color:#18221b}header{background:#174c32;color:#fff;padding:28px 18px}main{max-width:1050px;margin:auto;padding:20px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccd6ce;border-radius:12px;font-size:16px}.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.day,.result{background:#fff;border:1px solid #dce4de;border-radius:14px;padding:16px}.day{display:block;text-decoration:none;color:inherit}.result{margin:10px 0}.num{font-weight:700;color:#174c32}.tag{color:#52715e;font-size:13px}</style></head><body><header><main><h1>📚 İslam'ı Öğrenme — Yol Haritası</h1><div>19 yeni soru / gün · 9 dil · Ayet/Hadis · Kaynaklar</div></main></header><main><h2>🔎 Soru ara</h2><input id="search" placeholder="Bir kelime yazın: iman, sabır, namaz..."><div id="results"></div><h2>📅 Günler</h2><div class="days" id="days"></div><h2>📌 Sistem</h2><p>Her gün 19 yeni soru. Soru numaraları kesintisiz devam eder. Benzer sorular azaltılır. Ayet/hadis ve kaynaklar doğrudan ilgili soru numarasına bağlanır.</p></main><script src="data.js"></script><script>for(let d=1;d<=Math.ceil(QUESTIONS.length/19);d++){let a=(d-1)*19+1,b=Math.min(d*19,QUESTIONS.length);days.innerHTML+=`<a class="day" href="gun-${d}.html"><b>📅 ${d}. Gün</b><br><span class="tag">Soru ${a}–${b}</span></a>`}search.oninput=()=>{let q=search.value.trim().toLocaleLowerCase('tr-TR');results.innerHTML=q?QUESTIONS.filter(x=>(x.q+' '+x.a+' '+x.langs.join(' ')).toLocaleLowerCase('tr-TR').includes(q)).map(x=>`<div class="result"><span class="num">Soru ${x.n}</span><br><b>${x.q}</b><br>${x.a}</div>`).join(''):'<p>Aramak için bir kelime yazın.</p>'}</script></body></html>
