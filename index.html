<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Bir Müslümanın Yol Haritası — 11 Dilde İslami Bilgi"
  >

  <meta
    name="theme-color"
    content="#f5f1e8"
  >

  <title>Yol Haritası</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =========================================
       ANA SAYFA
  ========================================== -->

  <main id="home-page">

    <header class="home-header">

      <!-- ANA SAYFA DİL SEÇİMİ -->

      <div
        id="home-language-selector"
        class="language-selector"
        aria-label="Dil seçimi"
      >
      </div>


      <!-- =====================================
           ÜÇGEN KUTSAL MEKÂNLAR
      ====================================== -->

      <div class="holy-sites">

        <!-- ÜST: KÂBE -->

        <div class="holy-site holy-site-kaaba">

          <img
            src="images/Kabe.jpg"
            alt="Kâbe"
            loading="eager"
          >

        </div>


        <!-- ALT SOL: MESCİD-İ AKSÂ -->

        <div class="holy-site holy-site-aqsa">

          <img
            src="images/Aksa.jpg"
            alt="Mescid-i Aksâ"
            loading="eager"
          >

        </div>


        <!-- ALT SAĞ: MESCİD-İ NEBEVÎ -->

        <div class="holy-site holy-site-nabawi">

          <img
            src="images/Nebevi.jpg"
            alt="Mescid-i Nebevî"
            loading="eager"
          >

        </div>


        <!-- ORTA BAŞLIK -->

        <div class="roadmap-title">

          <div>
            Bir Müslümanın
          </div>

          <div>
            Yol Haritası
          </div>

        </div>

      </div>


      <!-- ALT AÇIKLAMA -->

      <p class="home-subtitle">
        İslâm'ı adım adım öğren
      </p>

    </header>


    <!-- =====================================
         GÜNLER
    ====================================== -->

    <section class="days-section">

      <h2>Günler</h2>

      <div id="days-list"></div>

    </section>

  </main>


  <!-- =========================================
       SORU SAYFASI
  ========================================== -->

  <main
    id="question-page"
    style="display:none;"
  >

    <!-- DİL SEÇİCİ VE ÜST NAVİGASYON -->

    <nav
      id="top-navigation"
      class="navigation"
    >
    </nav>


    <!-- SORU İÇERİĞİ -->

    <section
      id="question-content"
      class="question-content"
    >
    </section>


    <!-- ALT NAVİGASYON -->

    <nav
      id="bottom-navigation"
      class="navigation"
    >
    </nav>

  </main>


  <!-- =========================================
       FOOTER
  ========================================== -->

  <footer>

    <p>
      Bir Müslümanın Yol Haritası
    </p>

  </footer>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script
    src="app.js"
    defer
  ></script>

</body>

</html>
