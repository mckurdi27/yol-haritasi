<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bir Müslümanın Yol Haritası — 76 Soru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <h1>Bir Müslümanın Yol Haritası</h1>
            <p>76 Temel Soru ve Cevap</p>
            
            <div class="language-selector-wrapper">
                <label for="languageSelect">🌍 Görünüm Dili / Display Language:</label>
                <select id="languageSelect" onchange="changeLanguage()">
                    <option value="tr" selected>🇹🇷 Türkçe</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="ku">🇹🇯 Kurmancî</option>
                    <option value="tt">🇹🇹 Tatarca</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="ar">🇸🇦 العربية</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container" id="contentArea">
        <!-- İçerik dinamik olarak yüklenecek -->
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Bir Müslümanın Yol Haritası. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
