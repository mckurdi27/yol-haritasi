<!DOCTYPE html>
<html lang="tr">

<head>

  <meta

           BAŞLIK
      ====================================== -->

      <div class="holy-sites">


        <!-- ===================================

        ==================================== -->

        <div
          class="holy-site holy-site-kaaba"
        >

          <img
            src="Images/Kabe.jpg"

        </div>


        <!-- ===================================
             MESCİD-İ AKSÂ

        ==================================== -->

        <div class="roadmap-title">

    ====================================== -->
